# Budgy's native iPhone app (ios/README.md). The Xcode project is generated on the build Mac with
# XcodeGen (`xcodegen generate`); neither it nor Budgy/Info.plist is kept in git.
name: Budgy
options:
  bundleIdPrefix: com.ari
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: he
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 language mode: Swift 6's strict concurrency checks are not worth their errors here.
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Budgy:
    type: application
    platform: iOS
    sources:
      - path: Budgy
    info:
      path: Budgy/Info.plist
      properties:
        CFBundleDisplayName: Budgy
        # XcodeGen would write "1.0" and "1"; the TestFlight build sets the build number to the run's.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.finance
        NSFaceIDUsageDescription: כדי לפתוח את Budgy עם Face ID.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    # iCloud's key-value store, which carries the data to the user's other iPhones; the App ID needs the
    # iCloud capability.
    entitlements:
      path: Budgy/Budgy.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ari.budgy
        # The iPhone alone. Set on the target: XcodeGen's preset for iOS targets ('1,2', iPhone and iPad)
        # outweighs the project's setting, and App Store Connect then asks for iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
schemes:
  Budgy:
    build:
      targets:
        Budgy: all
    run:
      config: Debug
    archive:
      config: Release
