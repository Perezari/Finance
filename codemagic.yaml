# Budgy's native iPhone app (ios/README.md) on Codemagic's Mac minis: a personal account has 500 free
# minutes a month on them, shared with Sogia. Nothing starts on its own: a build runs when it is started
# in Codemagic (Start new build).
#
# The TestFlight workflow reads the variable group "app_store", set in this app's Environment
# variables, each variable Secret: APPLE_API_ISSUER, APPLE_API_KEY (the Key ID), APPLE_API_KEY_P8 (the
# text of the .p8 file) and APPLE_DEVELOPMENT_TEAM.
definitions:
  scripts:
    - &project
      name: Xcode project
      script: |
        xcodebuild -version
        brew install xcodegen
        cd ios
        xcodegen generate

workflows:
  testflight:
    name: iPhone · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      groups:
        - app_store
    scripts:
      - *project
      - name: App Store build, uploaded to TestFlight
        script: bash ios/scripts/testflight.sh

  screenshots:
    name: iPhone · screenshots
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - *project
      - name: Simulator build and screenshots
        script: bash ios/scripts/screenshots.sh
    artifacts:
      - ios/build/screenshots/*.png
